[package]
name = "prevention-terminal"
version = "0.0.1"
description = "Prevention Terminal — desktop app for school specialists."
edition = "2021"
rust-version = "1.77"

[lib]
name = "prevention_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-http = "2.0"
tauri-plugin-shell = "2.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Phase 3.9 — приём base64-байт DOCX из webview и запись на диск.
# Используется ровно в одной команде `save_docx`; крейт стабильный и без сети.
base64 = "0.22"

# Локальная зашифрованная БД (Phase 2).
# Фича bundled-sqlcipher собирает SQLCipher из исходников вместе с rusqlite,
# чтобы у пользователей не было внешней зависимости от системного libsqlcipher.
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }

# Криптография для derive ключа БД из мастер-пароля.
argon2 = "0.5"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"

tiny_http = "0.12"

[features]
# Стандартный набор фич Tauri 2; кастомные фичи добавим, когда появятся.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
