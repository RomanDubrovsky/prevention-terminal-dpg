    <script>
      var _isBot = /bot|googlebot|yandex|crawler|spider|robot|crawling|lighthouse|bingbot|duckduckbot|baiduspider|facebookexternalhit/i.test(navigator.userAgent || '');
      var _lastErrorNoticeTime = 0;
      function showFriendlyErrorNotice(customMsg) {
        if (_isBot) return;
        var now = Date.now();
        if (now - _lastErrorNoticeTime < 15000) return;
        _lastErrorNoticeTime = now;

        var existing = document.getElementById('friendly-error-toast');
        if (existing) existing.remove();

        var toast = document.createElement('div');
        toast.id = 'friendly-error-toast';
        toast.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:999999;max-width:420px;background:rgba(15,23,42,0.92);color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:16px 20px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,0.3);font-family:system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.5;display:flex;gap:14px;align-items:flex-start;border:1px solid rgba(255,255,255,0.15);';

        var icon = document.createElement('div');
        icon.style.cssText = 'font-size:22px;line-height:1;flex-shrink:0;';
        icon.innerHTML = '🛠️';

        var body = document.createElement('div');
        body.style.cssText = 'flex:1;';
        body.innerHTML = '<strong style="display:block;font-size:14px;margin-bottom:4px;color:#60A5FA;">На странице зафиксирован сбой</strong>' +
          (customMsg || 'Автоматическая система диагностики уже зафиксировала ошибку и приняла её в работу. Пожалуйста, попробуйте повторить действие через 10–15 минут.');

        var closeBtn = document.createElement('button');
        closeBtn.innerHTML = '✕';
        closeBtn.style.cssText = 'background:none;border:none;color:#94A3B8;font-size:16px;cursor:pointer;padding:0 0 0 8px;line-height:1;';
        closeBtn.onclick = function() { toast.remove(); };

        toast.appendChild(icon);
        toast.appendChild(body);
        toast.appendChild(closeBtn);
        document.body.appendChild(toast);

        setTimeout(function() {
          if (toast && toast.parentNode) {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.5s ease';
            setTimeout(function() { if (toast.parentNode) toast.remove(); }, 500);
          }
        }, 12000);
      }

      function _isChunkError(str) {
        var s = String(str || '').toLowerCase();
        return s.indexOf('failed to fetch dynamically imported module') !== -1 ||
               s.indexOf('unable to preload css') !== -1 ||
               s.indexOf('error loading dynamically imported module') !== -1 ||
               s.indexOf('loading chunk') !== -1;
      }

      window.addEventListener('error', function(e) {
        if (_isBot) return;
        var msg = e.message || '';
        if (_isChunkError(msg) || _isChunkError(e.filename)) return;

        fetch('https://api.prevention.school/api/telemetry/client-error', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ message: e.message, source: e.filename, lineno: e.lineno, url: window.location.href, stack: e.error ? e.error.stack : '' })
        }).catch(function(err) {});
        showFriendlyErrorNotice();
      });

      window.addEventListener('unhandledrejection', function(e) {
        if (_isBot) return;
        if (e.reason && (e.reason.name === 'AbortError' || String(e.reason).indexOf('AbortError') !== -1)) return;
        var reasonStr = e.reason ? e.reason.toString() : '';
        if (_isChunkError(reasonStr)) return;

        fetch('https://api.prevention.school/api/telemetry/client-error', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ message: reasonStr || 'Unhandled Rejection', source: 'promise', url: window.location.href })
        }).catch(function(err) {});
        showFriendlyErrorNotice();
      });
      window.showFriendlyErrorNotice = showFriendlyErrorNotice;
    </script>
  <!-- Yandex.Metrika counter & Auto-Goal Tracker -->
<script type="text/javascript">
(function(m,e,t,r,i,k,a){
    m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
    m[i].l=1*new Date();
    for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
    k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
})(window, document,'script','https://mc.yandex.ru/metrika/tag.js', 'ym');

(function(){
    try {
        if (window.location.search.indexOf('no_track=1') !== -1 || window.location.search.indexOf('admin=1') !== -1) {
            localStorage.setItem('ym_disable_tracking', '1');
        }
        if (localStorage.getItem('ym_disable_tracking') === '1') {
            console.log('[Yandex.Metrika] Tracking disabled for owner/admin session.');
            window.ymGoal = window.reachGoal = function(g, p){ console.log('[Goal skipped (admin)]', g, p || ''); };
            return;
        }
    } catch(e) {}

    var host = (window.location.hostname || '').toLowerCase();
    var id = null;
    if (host.indexOf('ida-psy.ru') !== -1) id = 113108416;
    else if (host.indexOf('ida-psy.pro') !== -1) id = 113706104;
    else if (host.indexOf('prevention-ai.ru') !== -1) id = 113108883;
    else if (host.indexOf('prevention.school') !== -1) id = 113706126;
    else if (host.indexOf('teenology-ai.ru') !== -1) id = 113108854;
    else if (host.indexOf('teenology.care') !== -1) id = 109437867;
    else if (host.indexOf('ru.decima.business') !== -1) id = 93591954;
    else if (host.indexOf('decima.business') !== -1) id = 93591880;
    else {
        id = 113108883;
    }

    window._ymCounterId = id;

    // Universal Goal Dispatcher
    window.ymGoal = window.reachGoal = function(goalName, params) {
        if (!id || typeof ym !== 'function') return;
        try {
            if (params) {
                ym(id, 'reachGoal', goalName, params);
            } else {
                ym(id, 'reachGoal', goalName);
            }
            console.log('[YM Goal]', goalName, params || '');
        } catch(e) {
            console.warn('[YM Goal Error]', e);
        }
    };

    if (id) {
        ym(id, 'init', {
            ssr: true,
            webvisor: true,
            clickmap: true,
            ecommerce: "dataLayer",
            referrer: document.referrer,
            url: location.href,
            accurateTrackBounce: true,
            trackLinks: true
        });
    }

    // Auto-Goal Click & Form Interceptors
    document.addEventListener('DOMContentLoaded', function(){
        // 1. Click tracker for buttons, links, actions
        document.addEventListener('click', function(e){
            var target = e.target;
            if (!target) return;
            var el = target.closest('a, button, [data-goal], input[type="submit"]');
            if (!el) return;

            // Explicit data-goal attribute
            var explicitGoal = el.getAttribute('data-goal');
            if (explicitGoal) {
                window.ymGoal(explicitGoal);
                return;
            }

            var href = (el.getAttribute('href') || '').toLowerCase();
            var text = (el.innerText || el.textContent || el.value || '').trim().toLowerCase();
            var idStr = (el.id || '').toLowerCase();
            var cls = (el.className || '').toLowerCase();

            // Messengers & Social
            if (href.indexOf('t.me/') !== -1 || href.indexOf('telegram.me') !== -1) {
                window.ymGoal('telegram_click', {url: href});
            } else if (href.indexOf('vk.com/') !== -1) {
                window.ymGoal('vk_click', {url: href});
            } else if (href.indexOf('wa.me/') !== -1 || href.indexOf('whatsapp.com') !== -1) {
                window.ymGoal('whatsapp_click', {url: href});
            } else if (href.indexOf('tel:') === 0) {
                window.ymGoal('phone_click', {phone: href});
            } else if (href.indexOf('mailto:') === 0) {
                window.ymGoal('email_click', {email: href});
            } 
            // File downloads
            else if (/\.(pdf|docx?|xlsx?|zip|rar|pptx?)$/i.test(href)) {
                window.ymGoal('file_download', {file: href});
            }
            // Registration & Auth
            else if (href.indexOf('/join') !== -1 || href.indexOf('/staff-register') !== -1 || href.indexOf('/auth') !== -1 || href.indexOf('/register') !== -1 || idStr.indexOf('register') !== -1 || idStr.indexOf('login') !== -1 || text.indexOf('регистрац') !== -1 || text.indexOf('войти') !== -1 || text.indexOf('личный кабинет') !== -1) {
                window.ymGoal('auth_click', {text: text});
            }
            // Demo & Interactive Room
            else if (href.indexOf('#room=') !== -1 || href.indexOf('/demo') !== -1 || href.indexOf('/app') !== -1 || href.indexOf('/workspace') !== -1 || idStr.indexOf('demo') !== -1 || text.indexOf('демо') !== -1 || text.indexOf('попробовать') !== -1 || text.indexOf('запустить') !== -1) {
                window.ymGoal('demo_open', {text: text});
            }
            // Test & Screening
            else if (href.indexOf('/test') !== -1 || href.indexOf('screening') !== -1 || text.indexOf('тест') !== -1 || text.indexOf('диагностик') !== -1 || text.indexOf('опрос') !== -1) {
                window.ymGoal('test_start', {text: text});
            }
            // Pricing / Tariffs
            else if (href.indexOf('pricing') !== -1 || href.indexOf('tariff') !== -1 || text.indexOf('тариф') !== -1 || text.indexOf('купить') !== -1 || text.indexOf('подключить') !== -1) {
                window.ymGoal('pricing_click', {text: text});
            }
            // Feedback / Call to action
            else if (text.indexOf('оставить заявку') !== -1 || text.indexOf('записаться') !== -1 || text.indexOf('консультац') !== -1 || text.indexOf('связаться') !== -1) {
                window.ymGoal('lead_button_click', {text: text});
            }
        }, true);

        // 2. Form submission tracker
        document.addEventListener('submit', function(e){
            var form = e.target;
            if (!form) return;
            var formId = form.id || form.getAttribute('name') || form.getAttribute('action') || 'lead_form';
            window.ymGoal('form_submit', {form_id: formId});
        }, true);

        // 3. Scroll depth tracking (50% and 90%)
        var scroll50Fired = false;
        var scroll90Fired = false;
        window.addEventListener('scroll', function(){
            var h = document.documentElement, 
                b = document.body,
                st = 'scrollTop',
                sh = 'scrollHeight';
            var percent = ((h[st]||b[st]) / ((h[sh]||b[sh]) - h.clientHeight)) * 100;
            if (!scroll50Fired && percent >= 50) {
                scroll50Fired = true;
                window.ymGoal('scroll_50');
            }
            if (!scroll90Fired && percent >= 90) {
                scroll90Fired = true;
                window.ymGoal('scroll_90');
            }
        }, {passive: true});
    });
})();
</script>
